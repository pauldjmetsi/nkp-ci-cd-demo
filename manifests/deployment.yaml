apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkp-demo-app
  labels:
    app: nkp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nkp-demo
  template:
    metadata:
      labels:
        app: nkp-demo
    spec:
      containers:
        - name: nkp-demo
          image: ghcr.io/pauldjmetsi/nkp-ci-cd-demo:v202602191008
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v1.7"
            - name: BUILD_VERSION
              value: "v202602191008"

---

apiVersion: v1
kind: Service
metadata:
  name: nkp-demo-service
spec:
  type: LoadBalancer
  selector:
    app: nkp-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
